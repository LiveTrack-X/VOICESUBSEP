[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voicesubsep"
version = "0.1.1"
description = "Local speaker subtitle editor inference service"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0,<1",
  "starlette>=0.47.2,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
whisper = ["faster-whisper>=1.1,<2"]
diarization = [
  "torch>=2.11,<2.12",
  "transformers @ https://github.com/huggingface/transformers/archive/4b28d51d0d5f17ec20c23a187d0475a8e68810c8.zip",
  "librosa==0.11.0",
]
desktop-build = ["pyinstaller==6.22.3"]
gpu-windows = [
  "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32'",
  "nvidia-cudnn-cu12==9.26.0.51; sys_platform == 'win32'",
  "nvidia-cuda-runtime-cu12==12.9.79; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["voicesubsep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
