[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voicesubsep"
version = "0.1.0"
description = "Local speaker subtitle editor inference service"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0,<1",
  "starlette>=0.47.2,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
whisper = ["faster-whisper>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["voicesubsep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
